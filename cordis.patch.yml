# CraftWorkshop（方块工坊）— 通用 MC 整合包创作插件。
# 单包同时提供 Host 工具与 Web 主面板；下面的 config 会原样传给 apply()。
- insert:
    - id: craft-workshop
      name: '@ipthmc/craft-workshop'
      config:
        userAgent: 'craft-workshop/0.7.0 (https://ipthmc.zyghit.cn)'
        defaultGameVersion: '1.21.1'
        defaultLoader: neoforge
        defaultOutputRoot: ''
        cacheTtlSeconds: 600
        requestTimeoutMs: 20000
        maxDependencyDepth: 6
        curseForgeApiKey: ''
        projectFile: project.json
        designRoot: design
        defaultNamespace: ipthmc
        registryFile: ''
